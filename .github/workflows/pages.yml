# main → https://sommoix.github.io/pms/  ·  preview → https://sommoix.github.io/pms/preview/
name: pages
on:
  push: { branches: [main, preview] }
  workflow_dispatch:
permissions: { contents: read, pages: write, id-token: write }
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: main }
      - uses: actions/checkout@v4
        with: { ref: preview, path: preview }
      - run: |
          mkdir -p site/preview
          rsync -a --exclude .git --exclude .github main/ site/
          rsync -a --exclude .git --exclude .github preview/ site/preview/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: ${{ steps.d.outputs.page_url }} }
    steps:
      - id: d
        uses: actions/deploy-pages@v4
