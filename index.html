<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PMS</title>
<meta name="theme-color">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PMS">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-180.png">
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="./ui/tokens.css">
<link rel="stylesheet" href="./ui/base.css">
</head>
<body>
<div id="app" class="login">
 <!-- Sign in (English): username + password -->
 <section class="full" id="s-login" aria-label="Sign in">
  <div class="logo">PMS</div>
  <div><b>Preventive Maintenance System</b><div class="sec m">CE.SE · AEROTHAI</div></div>
  <form class="lg1" id="loginForm" novalidate>
   <label class="search"><input type="text" id="email" name="username" inputmode="text" autocomplete="username" autocapitalize="off" spellcheck="false" placeholder="sommai.sa" aria-label="Username"></label>
   <label class="search"><input type="password" id="pass" name="password" autocomplete="current-password" placeholder="Password" aria-label="Password"><button class="peek" type="button" data-peek aria-label="Show password" aria-pressed="false"><svg class="ic"><use href="./ui/icons.svg#i-eye"/></svg></button></label>
   <p class="st w lg-err" id="lgErr" role="alert" hidden><svg class="ic"><use href="./ui/icons.svg#i-warn"/></svg><span></span></p>
   <button class="btn" type="submit">Sign in</button>
  </form>
  <div class="lg3">
   <svg class="ic"><use href="./ui/icons.svg#i-lock"/></svg><b>รออนุมัติ</b>
   <p class="sec">ผู้ดูแลกองต้องอนุมัติบัญชีของคุณก่อนใช้งาน</p>
   <button class="btn" type="button" data-recheck>ตรวจสอบอีกครั้ง</button>
  </div>
  <p class="sec">Accounts are created by your administrator.</p>
  <p class="sec" id="lgDemo">Demo mode · sample data</p>
 </section>

 <!-- หน้าจอ: เนื้อหาวาดโดย js/views.js -->
 <section class="screen root" id="s-today"></section>
 <section class="screen root" id="s-pm"></section>
  <section class="screen root" id="s-docs"></section>
 <section class="screen root" id="s-me"></section>
 <section class="screen push" id="s-job"></section>
 <section class="screen push" id="s-reports"></section>
 <section class="screen push" id="s-years"></section>
 <section class="screen push" id="s-rounds"></section>
 <section class="screen push" id="s-kind"></section>
 <section class="screen push" id="s-view"></section>
 <section class="screen push" id="s-fill"></section>
 <section class="screen push" id="s-table"></section>
 <section class="screen push" id="s-form"></section>
 <section class="screen push" id="s-asset"></section>
 <section class="screen push" id="s-tools"></section>
 <section class="screen push" id="s-pick"></section>
 <section class="screen push" id="s-open"></section>
 <section class="screen push" id="s-import"></section>
 <section class="screen push" id="s-sarabun"></section>

 <div id="kbar"><button data-nx="-1">‹ ก่อนหน้า</button><b id="kbl"></b><button data-nx="1">ถัดไป ›</button><button data-sheet="wi">ดู WI</button><button data-done>เสร็จ</button></div>

 <nav class="tabbar" aria-label="เมนูหลัก">
  <a href="#/today" aria-current="page"><svg class="ic"><use href="./ui/icons.svg#i-home"/></svg>วันนี้</a>
  <a href="#/pm"><svg class="ic"><use href="./ui/icons.svg#i-clip"/></svg>งาน PM</a>
  <a href="#/docs"><svg class="ic"><use href="./ui/icons.svg#i-folder"/></svg>เอกสาร</a>
  <a href="#/me"><svg class="ic"><use href="./ui/icons.svg#i-user"/></svg>ฉัน</a>
 </nav>

 <button class="cta" id="cta" hidden></button>
 <div id="dim"></div>
 <button class="toast" id="toast" role="status"><svg class="ic"><use href="./ui/icons.svg#i-info"/></svg><span></span></button>
 <div class="bd" id="bd"></div>
 <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-label="รายละเอียด"></div>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" hidden>
<input type="file" id="file" hidden>
<script type="module" src="./js/app.js"></script>
</body>
</html>
